name: Bump plugin version

# The plugin cache is keyed by version, so a change that lands without a bump
# never reaches an installed copy. Every push to main bumps the patch version of
# each local plugin whose folder it touched; bump by hand only through dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin name, as marketplace.json lists it"
        required: true
        type: string
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump versions
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
          PLUGIN: ${{ inputs.plugin }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          node <<'EOF'
          const fs = require('fs')
          const { execSync } = require('child_process')
          const { BEFORE, PLUGIN, BUMP } = process.env
          const changed = PLUGIN ? [] : execSync(`git diff --name-only ${BEFORE} HEAD`, { encoding: 'utf8' }).split('\n')
          const { plugins } = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'))
          const bumped = []
          // Only plugins sourced from a folder here; github and git-subdir sources bump in their own repo.
          for (const { name, source } of plugins.filter(p => typeof p.source === 'string')) {
            const dir = source.replace(/^\.\//, '').replace(/\/$/, '')
            const manifest = `${dir}/.claude-plugin/plugin.json`
            const touched = PLUGIN ? PLUGIN === name : changed.some(f => f.startsWith(`${dir}/`))
            if (!touched) continue
            const text = fs.readFileSync(manifest, 'utf8')
            const [major, minor, patch] = text.match(/"version"\s*:\s*"(\d+)\.(\d+)\.(\d+)"/).slice(1).map(Number)
            const next = BUMP === 'major' ? `${major + 1}.0.0` : BUMP === 'minor' ? `${major}.${minor + 1}.0` : `${major}.${minor}.${patch + 1}`
            fs.writeFileSync(manifest, text.replace(/("version"\s*:\s*")[^"]+"/, `$1${next}"`))
            bumped.push(`${name} ${next}`)
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary=${bumped.join(', ')}\n`)
          EOF

      - name: Commit and push
        if: steps.bump.outputs.summary != ''
        # A push made with GITHUB_TOKEN starts no workflow, so this commit does not bump again.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(plugin): ${{ steps.bump.outputs.summary }}"
          git push origin HEAD:main
